name: Check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs rust + babashka pinned in .mise.toml, matching local dev.
      # cache must stay off: mise's rust "install" is a symlink into
      # ~/.cargo/bin while the toolchain lives in ~/.rustup, which the action
      # doesn't cache — a cache hit restores the symlink only, mise skips the
      # install, and rustup then auto-installs the toolchain without the
      # rustfmt/clippy components from .mise.toml.
      - uses: jdx/mise-action@v3.6.1
        with:
          # Only the check toolchain; the e2e-only tools in .mise.toml
          # (neovim, java, clojure, clj-kondo) are for local verification.
          install_args: "rust babashka"
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: bb fmt-check
      - name: Linting
        run: bb lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cache off — see the lint-fmt job
      - uses: jdx/mise-action@v3.6.1
        with:
          # Only the check toolchain; the e2e-only tools in .mise.toml
          # (neovim, java, clojure, clj-kondo) are for local verification.
          install_args: "rust babashka"
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: bb test

  # Proves the Windows release target compiles and links before a tag does
  # (the release matrix builds it, and nothing else on Windows runs). Clippy
  # covers the test targets too, since `#[cfg(unix)]` helpers leave otherwise
  # dead code behind; the tests themselves are not run (the harness writes
  # shell scripts and speaks POSIX signals).
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # cache off — see the lint-fmt job
      - uses: jdx/mise-action@v3.6.1
        with:
          install_args: "rust"
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Linting
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
